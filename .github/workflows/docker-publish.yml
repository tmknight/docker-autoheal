name: "Publish Docker image"

permissions:
  contents: "write"

on:
  workflow_dispatch:
    inputs:
      latest:
        description: 'True/False'
        default: 'false'
        required: false
        type: string
  workflow_call:
    inputs:
      latest:
        description: 'True/False'
        default: 'false'
        required: false
        type: string

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  DOCKER_REGISTRY: tmknight88
  # name of image
  IMAGE: docker-autoheal
  # github.repository as <account>/<repo>
  IMAGE_NAME: tmknight/docker-autoheal
  # Build args
  CONTEXT: .
  DISTRO: alpine
  RELEASE: stable
  BUILD_ARGS: |
    "EVENT_NAME=${{ github.event_name }}"
    "BRANCH=${{ github.ref_name }}"

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml

  push-to-registry:
    name: "Publish Docker image"
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup QEMU for multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
          platforms: |
            linux/amd64
            linux/arm64

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        id: container-registry
        # if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        id: docker-hub
        if: ${{ github.ref_name == 'main' && ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'schedule') }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},enable=true
            name=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE }},enable=${{ github.ref_name == 'main' && ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'schedule') }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
            type=ref,event=tag
            type=raw,enable=${{ github.ref_name == 'main' && inputs.latest == 'true' }},value=latest
            type=raw,enable=${{ github.ref_name == 'main' && inputs.latest == 'true' }},priority=1000,value=${{ needs.get-version.outputs.pkg-version }}
            type=raw,enable=${{ github.event_name == 'schedule' && inputs.latest != 'true' }},value=nightly

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        # continue-on-error: true
        # timeout-minutes: 360
        with:
          context: ${{ env.CONTEXT }}
          platforms: |
            linux/amd64
            linux/arm64
          file: docker/${{ env.DISTRO }}/${{ env.RELEASE }}/${{ env.IMAGE }}.dockerfile
          build-args: ${{ env.BUILD_ARGS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=A cross-platform tool to monitor and remediate unhealthy Docker containers
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          # cache-to: ''
          # cache-to: ${{ github.event_name != 'workflow_dispatch' && 'type=gha,mode=max' || '' }}
