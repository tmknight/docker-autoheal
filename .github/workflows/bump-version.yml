name: Bump Version

permissions:
  contents: "write"

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "05 05 * * *"

env:
  DOM: 01

jobs:
  get-rust:
    uses: ./.github/workflows/get-rust.yml

  get-DOM:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.get_date.outputs.proceed }}
    steps:
      - name: Get day of the month
        id: get_date
        run: |
          MONTH_DAY=$(date +'%d')
          if [ "$MONTH_DAY" = "${{ env.DOM }}" ]; then
            PROCEED=true
          else
            PROCEED=false
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

  bump-app-version:
    runs-on: ubuntu-latest
    needs: get-DOM
    if: ${{ needs.get-DOM.outputs.proceed == 'true' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # This token is required to commit changes back to the repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: get_version
        run: |
          # Extracts the version from Cargo.toml and sets it as an output
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump app version
        id: bump_version
        run: |
          # Increments the patch number of the version string
          NEW_VERSION=$(echo "${{ steps.get_version.outputs.version }}" | awk -F. -v OFS=. '{$3++;print}')
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml with patch version monthly
        run: |
          # Replaces the old version string with the new one in Cargo.toml
          sed -i 's/^version = ".*"/version = "${{ steps.bump_version.outputs.new_version }}"/' Cargo.toml

      - name: Commit and Push app changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml
          git commit -m "chore: Bump app version to ${{ steps.bump_version.outputs.new_version }}"
          git push

  bump-rust-version:
    runs-on: ubuntu-latest
    needs: get-rust
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # This token is required to commit changes back to the repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo.toml with rust version nightly
        run: |
          # Replaces the old version string with the new one in Cargo.toml
          sed -i 's/^rust-version = ".*"/rust-version = "${{ needs.get-rust.outputs.rust_version }}"/' Cargo.toml

      - name: Commit and Push rust changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml
          git commit -m "chore: Bump rust version to ${{ needs.get-rust.outputs.rust_version }}"
          git push
