name: Get Day of Month

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      proceed:
        description: "DOM match; proceed with activity"
        value: ${{ jobs.get-DOM.outputs.proceed }}

env:
  # DOM: '04|05'
  DOM: '05'
  
jobs:
  get-DOM:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.get_date.outputs.proceed }}
    steps:
      - name: Get day of the month
        id: get_date
        run: |
          MONTH_DAY=$(date +'%d')
          if [[ "|$DOM|" == *"|$MONTH_DAY|"* ]]; then
            PROCEED=true
          else
            PROCEED=false
          fi
          echo "DOM=${{ env.DOM }}; MONTH_DAY=$MONTH_DAY; proceed=$PROCEED"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
