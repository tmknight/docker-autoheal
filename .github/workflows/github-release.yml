name: "Github Release"

permissions:
  contents: "write"

on:
  workflow_run:
    workflows: ["Github Tag"]
    types: [completed]
    branches: [main]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # name of image
  IMAGE: docker-autoheal
  # github.repository as <account>/<repo>
  IMAGE_NAME: tmknight/docker-autoheal
  # Build args
  CONTEXT: .
  DISTRO: alpine
  RELEASE: stable

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml

  get-DOM:
    uses: ./.github/workflows/get-DOM.yml

  create-release:
    name: "Create release"
    needs: [get-version, get-DOM]
    runs-on: "ubuntu-latest"
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.get-DOM.outputs.proceed == 'true' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Create draft release"
        uses: "taiki-e/create-gh-release-action@v1"
        with:
          # (optional) Path to changelog.
          changelog: CHANGELOG.md
          branch: "main"
          ref: "refs/tags/${{ needs.get-version.outputs.pkg-version }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  upload-assets:
    name: "Upload assets"
    needs: [get-version, create-release, get-DOM]
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.get-DOM.outputs.proceed == 'true' }}
    strategy:
      matrix:
        include:
          - target: "x86_64-unknown-linux-gnu"
            os: "ubuntu-latest"
          - target: "x86_64-unknown-linux-musl"
            os: "ubuntu-latest"
          - target: "aarch64-unknown-linux-gnu"
            os: "ubuntu-latest"
          - target: "aarch64-unknown-linux-musl"
            os: "ubuntu-latest"
          # - target: "aarch64-unknown-openbsd"
          #   os: "ubuntu-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Upload assets"
        uses: "taiki-e/upload-rust-binary-action@v1"
        with:
          bin: ${{ env.IMAGE }}
          target: ${{ matrix.target }}
          archive: $bin-${{ matrix.target }}
          ref: refs/tags/${{ needs.get-version.outputs.pkg-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: "Publish release"
    needs: [get-version,upload-assets,get-DOM]
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.get-DOM.outputs.proceed == 'true' }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Release draft"
        run: gh release edit ${{ needs.get-version.outputs.pkg-version }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
